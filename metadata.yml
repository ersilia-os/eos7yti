Identifier: eos7yti
Slug: osm-series4
Status: Ready
Title: Antimalarial activity from OSM
Description: Scores triazolopyrazine analogues for antiplasmodial potency. 
  Ersilia trained two LazyQSAR classifiers on 413 Open Source Malaria Series 4 
  compounds, with IC50 cut-offs of 1 and 2.5 micromolar (123 and 175 actives), 
  reaching AUROC 0.89 and 0.87 in five-fold out-of-fold validation. Outputs are 
  ranks against 50,000 drug-like molecules. Predictors from this campaign guided
  generative rounds in which four of eight synthesised compounds were 
  submicromolar. Coverage is deepest around Series 4 chemistry.
